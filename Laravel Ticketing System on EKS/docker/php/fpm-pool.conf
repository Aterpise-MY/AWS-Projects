; =============================================================================
; php-fpm pool — replaces the stock [www] pool entirely (the default www.conf
; is deleted in the Dockerfile so this is the only pool definition).
; =============================================================================

[www]
user = app
group = app

; TCP, not a unix socket. nginx and php-fpm run as separate supervisor programs
; in the same container over 127.0.0.1; a socket file would have to live on the
; read-only root filesystem.
listen = 127.0.0.1:9000

; -----------------------------------------------------------------------------
; Process manager: ondemand
;
; `ondemand` forks a child only when a request arrives and reaps it after
; pm.process_idle_timeout. On a spot t4g.medium sharing the node with other
; pods, this keeps a mostly-idle web pod near zero PHP processes instead of
; parking `pm.min_spare_servers` children the way `dynamic` would.
; -----------------------------------------------------------------------------
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 10s

; Recycle a child after 500 requests to cap any slow memory growth in a
; long-lived worker. With opcache.validate_timestamps=0 the opcode cache
; survives the recycle, so the cost is negligible.
pm.max_requests = 500

; -----------------------------------------------------------------------------
; Database connection budget
;
;   pm.max_children = 10 per web pod
;   x 2 web pods (Deployment replicas, contract app_desired_size)
;   = 20 MySQL connections from web at absolute peak
;
; RDS db.t4g.micro default max_connections is ~85 (engine formula on ~1 GiB:
; {DBInstanceClassMemory/12582880}). Budget:
;   web:       10 x 2 = 20
;   worker:     ~1 x 2 =  2   (queue:work holds one connection each)
;   scheduler:         ~1
;   migrate hook (transient, only during a deploy)
;   ---------------------------
;   steady state ~23 of 85, leaving headroom for the Cluster Autoscaler to add
;   a fourth web pod (app_max_size = 4 -> 40) and still stay under the ceiling.
;
; Each php-fpm child opens at most one PDO connection (persistent connections
; are OFF in config/database.php), so max_children is a hard upper bound on
; this pod's share.
; -----------------------------------------------------------------------------

; A request still running after 30s is killed and logged; matches php.ini
; max_execution_time so neither silently outlives the other.
request_terminate_timeout = 30s

; php-fpm must log to stdout/stderr — no writable log path exists.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Expose the fpm status page on localhost for a future readiness sidecar; not
; routed publicly by nginx.
pm.status_path = /fpm-status

; Do not clear env vars: the ConfigMap and Secret values arrive as the
; container environment and Laravel reads them via getenv() during
; config:cache. The stock pool sets clear_env = yes, which would blank them.
clear_env = no
