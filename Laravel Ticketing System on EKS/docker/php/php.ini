; =============================================================================
; Application PHP settings — loaded as conf.d/zz-app.ini so it wins over the
; stock php.ini-production that ships in the base image.
; =============================================================================

; --- Errors -----------------------------------------------------------------
; Never render errors into the HTTP response; Laravel's handler + the stderr
; log channel own error presentation. display_errors would leak stack traces to
; the browser.
display_errors = Off
display_startup_errors = Off
; Send PHP's own startup/segfault errors to stderr so Fluent Bit captures them
; alongside the application log. No log file — the root filesystem is read-only.
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Memory & execution -----------------------------------------------------
; A web request that needs more than 256M is a bug, not a config problem; the
; worker sets its own higher limit via the queue:work command if ever needed.
memory_limit = 256M
; Below the ALB idle timeout (60s) and the fpm request_terminate_timeout so a
; runaway request is killed by PHP with a clean log line first.
max_execution_time = 30
max_input_time = 30

; --- Uploads ----------------------------------------------------------------
; 12M ceiling here sits ABOVE the app's 10 MB (10240 KB) validation rule and
; MUST match nginx client_max_body_size. If nginx were smaller the client would
; get a bare 413 before Laravel could return a friendly validation error; if
; PHP were smaller the file would be silently truncated to empty.
upload_max_filesize = 12M
post_max_size = 13M
max_file_uploads = 5
; php-fpm cannot use the read-only root filesystem for spooling large uploads.
; /tmp is an emptyDir mount.
upload_tmp_dir = /tmp
sys_temp_dir = /tmp

; --- Sessions ---------------------------------------------------------------
; Laravel drives sessions through Redis, not PHP's own handler, but set a sane
; default so nothing accidentally writes session files to the read-only FS.
session.save_handler = files
session.save_path = /tmp

; --- Misc hardening ---------------------------------------------------------
expose_php = Off
; Timezone is also set by Laravel; defining it here silences the PHP warning
; during the brief window before the framework boots.
date.timezone = UTC
; realpath cache pairs with opcache.validate_timestamps=0: paths never change in
; an immutable image, so cache them aggressively.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
