; =============================================================================
; OPcache — tuned for an immutable, single-version-per-image deployment.
; =============================================================================

opcache.enable = 1
opcache.enable_cli = 0

; The image is immutable: the PHP files for a given tag never change, so there
; is no reason to stat every file on every request looking for edits. Turning
; the timestamp check off removes a filesystem syscall per included file per
; request — the single biggest OPcache win in production. The trade-off is that
; a code change requires a new image and a rollout, which is exactly the
; deployment model here (image tag = git SHA, never `latest`).
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; 192 MB holds the whole framework + application classmap with headroom; below
; ~128 MB Laravel starts evicting and the hit rate collapses.
opcache.memory_consumption = 192

opcache.interned_strings_buffer = 16
; Laravel + vendor is well over 10k files; the default 10000 would thrash.
opcache.max_accelerated_files = 20000

; JIT off. Laravel is I/O bound (MySQL, Redis, S3, SMTP), not CPU bound, so the
; tracing JIT buys little and its extra memory is better spent on the opcode
; cache above.
opcache.jit = disable
opcache.jit_buffer_size = 0

; Preloading is intentionally not configured: it pins classes for the pool's
; lifetime and complicates the read-only-FS story for marginal gain here.
opcache.fast_shutdown = 1
opcache.enable_file_override = 0
