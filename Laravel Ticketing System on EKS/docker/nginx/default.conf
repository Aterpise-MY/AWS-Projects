# =============================================================================
# nginx server for the web pod. Fronts php-fpm over 127.0.0.1:9000.
#
# Every writable path points at an emptyDir mount because the container root
# filesystem is read-only. nginx's compiled-in defaults (/var/lib/nginx/tmp,
# /var/lib/nginx/logs) would otherwise fail to open on boot.
# =============================================================================

server {
    # Port 8080, not 80: the process runs as UID 1000 and only root may bind a
    # port below 1024. The Service and the ALB target group both point here.
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /var/www/public;
    index index.php;

    # Must equal php.ini upload_max_filesize (12M). If this were smaller, nginx
    # would return a bare 413 before the request ever reached PHP, so Laravel's
    # friendly "file too large" validation message would never be shown.
    client_max_body_size 12M;

    # Body spool + temp paths on the writable emptyDir mounts.
    client_body_temp_path /var/lib/nginx/tmp/client_body;
    proxy_temp_path       /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path     /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path       /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path        /var/lib/nginx/tmp/scgi;

    # Access log off, error log to stderr: Fluent Bit ships the container
    # stream; the ALB already records access logs to S3, so a second copy here
    # is noise.
    access_log off;
    error_log /dev/stderr warn;

    # Do not advertise the nginx version in the Server header or on error pages.
    server_tokens off;

    charset utf-8;

    # Front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Liveness and readiness must not be spammed into any log even if access_log
    # were re-enabled for debugging.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }
    location = /health/ready {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Compiled Vite assets are fingerprinted, so they can be cached hard.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Give slow endpoints room but stay under the ALB 60s idle timeout so
        # the ALB never closes the socket mid-response.
        fastcgi_read_timeout 45s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Deny dotfiles and anything that should never be served (.env, .git).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
