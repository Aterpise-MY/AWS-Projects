; =============================================================================
; supervisord — process manager for the WEB pod only.
;
; Runs nginx and php-fpm side by side in one container. The worker and scheduler
; pods do NOT use supervisor: entrypoint.sh exec's their single artisan command
; so it becomes PID 1 and receives SIGTERM directly for a clean drain.
;
; nodaemon=true is mandatory in a container: supervisord itself must be the
; foreground PID 1 so Kubernetes can signal it. Backgrounding would leave PID 1
; as a dead shell and break pod termination.
; =============================================================================

[supervisord]
nodaemon=true
user=app
; pidfile and any child logs go to the writable emptyDir mounts, never the
; read-only root filesystem.
pidfile=/var/run/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:php-fpm]
; -F keeps php-fpm in the foreground so supervisor can supervise it.
command=php-fpm -F
autostart=true
autorestart=true
; If php-fpm dies, the pod is broken — bubble the failure up so supervisor
; exits and Kubernetes restarts the container rather than limping on with only
; nginx serving 502s.
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Give queue-independent web requests time to finish on shutdown.
stopwaitsecs=30
stopsignal=QUIT

[program:nginx]
; daemon off keeps nginx in the foreground.
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=30
; QUIT = graceful: nginx finishes in-flight requests before exiting.
stopsignal=QUIT

[eventlistener:processexit]
; If either program exits unexpectedly, stop supervisord so the whole container
; restarts. A pod running nginx-without-fpm (or vice versa) would pass the TCP
; check but serve errors — fail loudly instead.
command=bash -c "printf 'READY\n'; while read -r line; do kill -SIGQUIT $PPID; done"
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
