# ---------------------------------------------------------------------------
# PORTFOLIO NOTE
# This file lives inside the project folder so the whole stack reads as one
# self-contained unit in the portfolio repository. GitHub ONLY executes
# workflows found at the repository root under `.github/workflows/`, so this
# copy is documentation here. In the standalone `github.com/brendonang/
# ticketing-platform` repository this project folder IS the repository root and
# every path below resolves as written.
#
# AUTHENTICATION
# GitHub OIDC only. There is no IAM user, no access key, and no AWS secret
# stored in this repository. `aws-actions/configure-aws-credentials` exchanges
# the short-lived GitHub OIDC token for STS credentials that expire in an hour.
#
# ACTION PINNING
# Third-party actions are pinned to a major version tag here for readability.
# The production posture is to pin every third-party action to a full commit
# SHA (e.g. `actions/checkout@8f4b7f8...`) so a compromised or retagged release
# cannot silently change what runs against these credentials.
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required to mint the GitHub OIDC token
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.3"
  TERRAFORM_VERSION: "1.15.1"

jobs:
  # -------------------------------------------------------------------------
  # PHP: lint, static analysis at PHPStan level 6, and the Pest/PHPUnit suite
  # against real MySQL and Redis service containers. Service containers (rather
  # than SQLite + the array cache driver) are the point: the queue tests only
  # mean something against a real Redis, and the migrations only mean something
  # against a real MySQL 8.0.
  # -------------------------------------------------------------------------
  php:
    name: PHP lint, PHPStan, Pest
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: ticketing_test
          MYSQL_USER: ticketing
          MYSQL_PASSWORD: ci_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, redis, bcmath, intl, gd, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('app/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: app
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP syntax lint
        working-directory: app
        run: |
          find app bootstrap config database routes tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Code style (Laravel Pint, check only)
        working-directory: app
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan level 6)
        working-directory: app
        run: ./vendor/bin/phpstan analyse --level=6 --no-progress --memory-limit=1G

      - name: Prepare test environment
        working-directory: app
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: mysql
          REDIS_HOST: 127.0.0.1

      - name: Run the test suite
        working-directory: app
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: ticketing_test
          DB_USERNAME: ticketing
          DB_PASSWORD: ci_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          REDIS_CACHE_DB: "0"
          REDIS_QUEUE_DB: "2"
          CACHE_STORE: redis
          QUEUE_CONNECTION: redis
          SESSION_DRIVER: redis
        run: |
          php artisan migrate --force
          ./vendor/bin/pest --ci

  # -------------------------------------------------------------------------
  # Container image linting.
  # -------------------------------------------------------------------------
  dockerfile:
    name: hadolint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: warning

  # -------------------------------------------------------------------------
  # Terraform: format, lint and a security/compliance scan.
  # AWS credentials are needed here because `terraform init` reads the S3
  # backend. They arrive via OIDC and are read-only for this role.
  # -------------------------------------------------------------------------
  terraform:
    name: tflint + checkov
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ci-terraform-${{ github.run_id }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive terraform/

      - name: terraform init + validate (dev)
        working-directory: terraform/dev
        run: |
          terraform init -input=false
          terraform validate

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=warning

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          quiet: true
          soft_fail: false
          # Dev-environment exceptions, each deliberate and documented in
          # docs/security.md rather than silently suppressed:
          #   CKV_AWS_144 no cross-region S3 replication for a dev bucket
          #   CKV_AWS_157 RDS is intentionally single-AZ in dev
          #   CKV_AWS_353 RDS Performance Insights is off to stay in budget
          skip_check: CKV_AWS_144,CKV_AWS_157,CKV_AWS_353

  # -------------------------------------------------------------------------
  # Ansible playbooks used to bake the node AMI with Packer.
  # -------------------------------------------------------------------------
  ansible:
    name: ansible-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible-lint
        run: pip install --disable-pip-version-check "ansible-lint>=24.0" ansible-core
      - name: ansible-lint
        run: ansible-lint --profile production ansible/playbooks/

  # -------------------------------------------------------------------------
  # Helm chart: lint, then render and validate the rendered manifests against
  # the Kubernetes 1.36 OpenAPI schemas. `helm lint` alone will happily pass a
  # chart that renders an invalid Deployment.
  # -------------------------------------------------------------------------
  helm:
    name: helm lint + kubeconform
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: "0.6.7"
      K8S_SCHEMA_VERSION: "1.36.0"
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: helm lint
        run: helm lint helm/ticketing --strict

      - name: Install kubeconform
        run: |
          curl -sSfL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: helm template | kubeconform
        # -ignore-missing-schemas covers the CRDs installed by add-ons
        # (ExternalSecret, SecretStore, ScaledObject, TargetGroupBinding);
        # everything with a core/apps API group is checked strictly.
        run: |
          helm template ticketing helm/ticketing \
            --namespace ticketing \
            --set image.repository=example.dkr.ecr.ap-southeast-1.amazonaws.com/ticketing/app \
            --set image.tag=0000000000000000000000000000000000000000 \
            | kubeconform \
                -strict \
                -summary \
                -ignore-missing-schemas \
                -kubernetes-version "${K8S_SCHEMA_VERSION}" \
                -schema-location default \
                -
