# ---------------------------------------------------------------------------
# PORTFOLIO NOTE
# This file lives inside the project folder so the whole stack reads as one
# self-contained unit in the portfolio repository. GitHub ONLY executes
# workflows found at the repository root under `.github/workflows/`, so this
# copy is documentation here. In the standalone `github.com/brendonang/
# ticketing-platform` repository this project folder IS the repository root.
#
# AUTHENTICATION
# GitHub OIDC only — no stored AWS credentials and no IAM user. The role
# assumed here is plan-only (read plus state lock); it cannot apply.
#
# ACTION PINNING
# Actions are pinned to a major version tag for readability. Production posture
# is a full commit SHA pin on every third-party action.
#
# WHY THIS WORKFLOW EXISTS
# Every infrastructure change gets a plan AND a priced cost delta posted to the
# pull request before anyone can approve it. Cost visibility attached to the
# review, rather than discovered in next month's bill, is the mechanism that
# keeps this environment inside its budget: a PR that quietly swaps a NAT
# Gateway in or turns on Multi-AZ shows up as a number a reviewer has to accept.
# ---------------------------------------------------------------------------
name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write        # mint the GitHub OIDC token
  contents: read
  pull-requests: write   # post the plan and the cost delta as PR comments

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.15.1"
  TF_DIR: terraform/dev
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: fmt / validate / plan / cost
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: tf-plan-${{ github.run_id }}

      - name: terraform fmt -check
        id: fmt
        run: terraform fmt -check -recursive -diff terraform/

      - name: terraform init
        id: init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: terraform validate
        id: validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m \
            -out=tfplan | tee plan.txt
          terraform show -json tfplan > plan.json

      # Truncate before commenting: GitHub rejects issue comments over 65,536
      # characters, and a first-apply plan for this stack is far larger than that.
      - name: Render plan comment
        id: render
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo 'body<<PLAN_EOF'
            echo '## Terraform Plan — `terraform/dev`'
            echo
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| fmt | \`${{ steps.fmt.outcome }}\` |"
            echo "| init | \`${{ steps.init.outcome }}\` |"
            echo "| validate | \`${{ steps.validate.outcome }}\` |"
            echo "| plan | \`${{ steps.plan.outcome }}\` |"
            echo
            echo '<details><summary>Show plan output</summary>'
            echo
            echo '```terraform'
            head -c 55000 plan.txt
            if [ "$(wc -c < plan.txt)" -gt 55000 ]; then
              echo
              echo "... output truncated at 55000 bytes — see the workflow run log for the full plan."
            fi
            echo '```'
            echo
            echo '</details>'
            echo
            echo "_Commit \`${{ github.sha }}\` — plan only, nothing was applied._"
            echo 'PLAN_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment the plan on the PR
        uses: peter-evans/create-or-update-comment@v4
        if: always()
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.render.outputs.body }}

      # -------------------------------------------------------------------
      # Infracost. `breakdown` on the base branch, then `diff` against the PR
      # plan, so the comment shows what THIS change costs rather than what the
      # whole stack costs.
      # -------------------------------------------------------------------
      - name: Set up Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Check out the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: Infracost baseline (base branch)
        run: |
          infracost breakdown \
            --path="base/${{ env.TF_DIR }}" \
            --format=json \
            --out-file=/tmp/infracost-base.json

      - name: Infracost diff (this PR)
        run: |
          infracost diff \
            --path="${{ env.TF_DIR }}" \
            --compare-to=/tmp/infracost-base.json \
            --format=json \
            --out-file=/tmp/infracost-diff.json

      - name: Comment the cost delta on the PR
        run: |
          infracost comment github \
            --path=/tmp/infracost-diff.json \
            --repo="$GITHUB_REPOSITORY" \
            --pull-request="${{ github.event.pull_request.number }}" \
            --github-token="${{ secrets.GITHUB_TOKEN }}" \
            --behavior=update
