---
# roles/cis-hardening/handlers/main.yml

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  # Only ever reached from a notify, so "changed" is accurate by construction.

- name: Restart sshd
  ansible.builtin.systemd_service:
    name: sshd
    state: restarted
  # > Restarting sshd does not drop the connection Packer or an operator is
  # > currently using — existing sessions are held by forked children. The
  # > config is validated with `sshd -t` before it is written, so a syntax error
  # > cannot lock anyone out.

# auditd on AL2023 refuses `systemctl restart` (RefuseManualStop=yes in the
# unit). The supported path is the service wrapper, which handles the stop/start
# sequence correctly.
- name: Restart auditd
  ansible.builtin.command: /usr/sbin/service auditd restart
  changed_when: true
