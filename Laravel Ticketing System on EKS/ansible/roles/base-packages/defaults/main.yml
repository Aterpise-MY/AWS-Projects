---
# roles/base-packages/defaults/main.yml
#
# HOST layer only. Nothing here installs an application runtime — no PHP, no
# Composer, no nginx. Those live in the container image built by docker/.

# Packages every node needs for operations, diagnostics and incident response.
# Kept deliberately short: every package is attack surface and every package is
# something to patch.
base_packages_install:
  - amazon-ssm-agent      # SSM Session Manager, Run Command, Patch Manager
  - chrony                # clock sync; certificate and token validation depend on it
  - jq                    # log and metadata parsing during an incident
  - tar                   # required by kubectl cp and several CSI drivers
  - unzip
  - bind-utils            # dig / nslookup for CoreDNS resolution issues
  - iproute-tc            # tc, needed to inspect CNI traffic shaping
  - conntrack-tools       # conntrack table inspection when kube-proxy misbehaves
  - socat                 # required by kubectl port-forward
  - nc                    # connectivity checks to RDS and ElastiCache
  - lsof
  - sysstat               # sar / iostat for post-incident analysis
  - htop
  - ethtool

# Packages that must not be present on a node.
#
# telnet / ftp: cleartext clients, CIS 2.3.x.
# rsh / ypbind: legacy trust-based remote access, CIS 2.3.x.
base_packages_remove:
  - telnet
  - ftp
  - rsh
  - ypbind
  - tftp

base_packages_timezone: "UTC"

# NTP sources. The link-local address is the Amazon Time Sync Service, which is
# reachable without egress and does not depend on the NAT Gateway.
base_packages_ntp_servers:
  - "169.254.169.123"

# journald limits. Nodes have a 30 GiB root volume shared with the container
# image cache; an unbounded journal is a real disk-pressure eviction cause.
base_packages_journald_max_use: "512M"
base_packages_journald_max_file_size: "64M"
base_packages_journald_max_retention: "7day"

# File descriptor limits. A node running 30+ pods with the VPC CNI opens a lot
# of sockets; the AL2023 default of 1024 soft is far too low.
base_packages_nofile_soft: 65536
base_packages_nofile_hard: 1048576
base_packages_nproc_soft: 32768
base_packages_nproc_hard: 65536

# Automatic in-place patching is deliberately DISABLED. Nodes on this platform
# are replaced, not patched: a node patched in place no longer matches the
# GitSHA / SourceAMI provenance tags on its own AMI, which defeats the entire
# reason the image is baked. OS patches arrive by rebaking and rolling.
base_packages_enable_dnf_automatic: false
