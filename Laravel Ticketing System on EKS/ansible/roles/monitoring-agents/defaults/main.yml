---
# roles/monitoring-agents/defaults/main.yml
#
# HOST-level observability only.
#
# Container logs and container metrics are NOT collected here — Fluent Bit runs
# as a DaemonSet in the amazon-cloudwatch namespace with its own IRSA role
# (irsa_role_arns["fluent_bit"]), and pod metrics come from metrics-server /
# Container Insights. This role covers what the node itself reports: memory,
# disk, and the host-level logs that exist before and after any pod does.

monitoring_cloudwatch_agent_package: amazon-cloudwatch-agent
monitoring_ssm_agent_service: amazon-ssm-agent

monitoring_cloudwatch_namespace: "Ticketing/EKS/Node"
monitoring_cloudwatch_log_group_prefix: "/ticketing-dev/node"

# 60s. Deliberately not 10s: on a 2-4 node dev cluster, high-resolution custom
# metrics cost more per month than the nodes they describe.
monitoring_metrics_interval_seconds: 60

# Log retention is set on the log group by Terraform, not by the agent. The
# agent cannot set retention, and a group auto-created by the agent defaults to
# never-expire, which is the single most common silent CloudWatch cost leak.
monitoring_log_retention_note: "Retention is owned by Terraform, not the agent."

# Host log files worth shipping. Container stdout/stderr is not in this list on
# purpose — that path belongs to Fluent Bit.
monitoring_host_log_files:
  - path: /var/log/messages
    log_stream: "{instance_id}/messages"
  - path: /var/log/secure
    log_stream: "{instance_id}/secure"
  - path: /var/log/audit/audit.log
    log_stream: "{instance_id}/audit"
  - path: /var/log/cloud-init-output.log
    log_stream: "{instance_id}/cloud-init"

monitoring_collect_disk_mountpoints:
  - "/"
  - "/var/lib/containerd"

# Set true only when running against a live node. During a Packer bake the agent
# is configured and left stopped so no build-instance identity is baked into its
# state directory.
monitoring_start_agent: "{{ not (packer_build | default(false) | bool) }}"
