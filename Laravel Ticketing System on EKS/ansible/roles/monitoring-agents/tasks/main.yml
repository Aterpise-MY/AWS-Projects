---
# roles/monitoring-agents/tasks/main.yml
#
# CloudWatch agent + SSM agent. Host layer only.
#
# The SSM agent is the reason there is no bastion host, no SSH key and no port
# 22 ingress anywhere in this platform. It is not optional infrastructure — it
# is the entire access path.

- name: Install the CloudWatch agent
  ansible.builtin.dnf:
    name: "{{ monitoring_cloudwatch_agent_package }}"
    state: present
  register: monitoring_cwagent_install
  retries: 3
  delay: 10
  until: monitoring_cwagent_install is succeeded

- name: Write the CloudWatch agent configuration
  ansible.builtin.template:
    src: amazon-cloudwatch-agent.json.j2
    dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
    owner: root
    group: root
    mode: "0644"
  notify: Apply CloudWatch agent configuration

- name: Enable the CloudWatch agent
  ansible.builtin.systemd_service:
    name: amazon-cloudwatch-agent
    enabled: true

# ---------------------------------------------------------------------------
# SSM agent
# ---------------------------------------------------------------------------

- name: Ensure the SSM agent is installed
  ansible.builtin.dnf:
    name: "{{ monitoring_ssm_agent_service }}"
    state: present

- name: Enable and start the SSM agent
  ansible.builtin.systemd_service:
    name: "{{ monitoring_ssm_agent_service }}"
    enabled: true
    state: started

# Session Manager shell preferences. Written here rather than left to the
# account default so that every session on this platform is logged and runs as a
# non-root user by default.
- name: Create the SSM agent configuration directory
  ansible.builtin.file:
    path: /etc/amazon/ssm
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure the SSM agent
  ansible.builtin.template:
    src: amazon-ssm-agent.json.j2
    dest: /etc/amazon/ssm/amazon-ssm-agent.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart SSM agent

# ---------------------------------------------------------------------------
# Bake-time cleanup
# ---------------------------------------------------------------------------
#
# Flush handlers before the cleanup below, otherwise the handler that applies
# the agent config would run *after* the state purge and re-create the state
# files this task is trying to remove.

- name: Flush handlers before purging agent state
  ansible.builtin.meta: flush_handlers

- name: Stop the CloudWatch agent for the bake
  ansible.builtin.systemd_service:
    name: amazon-cloudwatch-agent
    state: stopped
    enabled: true
  when: not (monitoring_start_agent | bool)

# The agent and SSM both persist an instance identity and a registration under
# these paths. Baking them means every node launched from the AMI reports as the
# build instance until the agent notices, which produces a genuinely confusing
# hour of debugging.
- name: Purge agent state so no build-instance identity is baked into the AMI
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/aws/amazon-cloudwatch-agent/logs/state
    - /opt/aws/amazon-cloudwatch-agent/logs/amazon-cloudwatch-agent.log
    - /var/lib/amazon/ssm/Vault/Store/RegistrationKey
    - /var/lib/amazon/ssm/registration
  when: not (monitoring_start_agent | bool)

- name: Ensure the CloudWatch agent is running on a live node
  ansible.builtin.systemd_service:
    name: amazon-cloudwatch-agent
    state: started
    enabled: true
  when: monitoring_start_agent | bool
