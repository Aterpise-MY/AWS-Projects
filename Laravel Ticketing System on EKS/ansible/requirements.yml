---
# ansible/requirements.yml
#
# Install with:
#   ansible-galaxy collection install -r requirements.yml
#
# Versions are floored, not pinned, because these collections track the AWS API
# and pinning them means missing new resource attributes. CI installs from this
# file on every run so a broken upstream release surfaces in the pipeline rather
# than during an incident.

collections:
  # aws_ec2 dynamic inventory plugin, rds_instance_snapshot, ec2_* modules
  - name: amazon.aws
    version: ">=9.0.0"

  # aws_ssm connection plugin, secretsmanager_secret module
  - name: community.aws
    version: ">=9.0.0"

  # sysctl, mount, seboolean, authorized_key helpers used by the hardening roles
  - name: ansible.posix
    version: ">=1.5.4"

  # random_string lookup used by db-maintenance credential rotation
  - name: community.general
    version: ">=9.0.0"

  # mysql_db / mysql_query used by the db-maintenance playbook
  - name: community.mysql
    version: ">=3.9.0"

  # k8s module used by db-maintenance to trigger a rolling restart
  - name: kubernetes.core
    version: ">=5.0.0"
