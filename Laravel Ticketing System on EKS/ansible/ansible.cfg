#
# ansible/ansible.cfg
#
# Boundary reminder: Ansible on this platform operates at the HOST layer and for
# day-2 operational tasks. It does NOT deploy the Laravel application — that is
# Kubernetes' job, driven by Helm from an image in ECR.
#
# Two consumers of this config:
#   1. Packer, at AMI bake time (ANSIBLE_CONFIG is set by the provisioner).
#   2. An operator running a day-2 playbook against live hosts over SSM.
#

[defaults]
inventory                  = inventory/aws_ec2.yml
roles_path                 = roles
collections_path           = collections:~/.ansible/collections:/usr/share/ansible/collections
stdout_callback            = yaml
callbacks_enabled          = profile_tasks, timer
bin_ansible_callbacks      = True
interpreter_python         = /usr/bin/python3
force_handlers             = True
retry_files_enabled        = False
deprecation_warnings       = True
display_skipped_hosts      = False
display_args_to_stdout     = False
gathering                  = smart
fact_caching               = jsonfile
fact_caching_connection    = /tmp/ansible_fact_cache
fact_caching_timeout       = 3600
nocows                     = 1
host_key_checking          = False
timeout                    = 60
forks                      = 10

# No log_path is set on purpose. Day-2 playbooks handle Secrets Manager
# material; writing a persistent Ansible log to disk on an operator workstation
# is an easy way to leak it. Tasks that touch secrets additionally set no_log.

[inventory]
enable_plugins  = aws_ec2, host_list, script, auto, yaml, ini
cache           = True
cache_plugin    = jsonfile
cache_connection = /tmp/ansible_inventory_cache
cache_timeout   = 300

# A dynamic inventory that silently returns zero hosts looks identical to
# "nothing needed changing". Fail loudly instead.
any_unparsed_is_failed = True

[ssh_connection]
# Host key checking is disabled because hosts are reached through SSM Session
# Manager port forwarding or through Packer's throwaway build instance. In both
# cases the host key is new on every connection and there is no stable
# known_hosts entry to validate against. Node identity is established by the
# SSM agent's IAM-authenticated registration, not by an SSH host key.
ssh_args           = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining         = True
transfer_method    = smart
control_path       = /tmp/ansible-ssh-%%h-%%p-%%r
retries            = 3

[persistent_connection]
connect_timeout = 60
command_timeout = 60

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False
