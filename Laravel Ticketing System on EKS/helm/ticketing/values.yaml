# ==============================================================================
# ticketing - default values
# ==============================================================================
# One values file only. There are no per-environment values files by design:
# the only things that differ between environments are infrastructure endpoints,
# and those are supplied by `terraform output` at install time via --set / -f -.
# Duplicating a 300-line values file per environment is how the two copies drift
# and how a production install silently keeps a stale dev Redis endpoint.
# ==============================================================================

nameOverride: ""
fullnameOverride: ""

# ------------------------------------------------------------------------------
# Image
# ------------------------------------------------------------------------------
image:
  # ECR repository URL, e.g. 022499047467.dkr.ecr.ap-southeast-1.amazonaws.com/ticketing/app
  repository: ""
  # MUST be the full 40-character git SHA. Deliberately empty so that a render
  # without an explicit tag fails loudly (see the guard in _helpers.tpl) rather
  # than quietly deploying whatever `latest` happens to point at today.
  tag: ""
  # IfNotPresent is safe precisely because the tag is an immutable content
  # address. With a mutable tag this setting would pin nodes to a stale layer.
  pullPolicy: IfNotPresent
  pullSecrets: []

# ------------------------------------------------------------------------------
# ServiceAccount / IRSA
# ------------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ticketing
  # module.eks output irsa_role_arns["app"] - grants S3 Get/Put/Delete/List on the
  # attachments bucket ONLY. Required for FILESYSTEM_DISK=s3.
  roleArn: ""
  annotations: {}

# ------------------------------------------------------------------------------
# Application configuration (non-secret). Rendered into the ConfigMap.
# ------------------------------------------------------------------------------
app:
  env: dev
  debug: "false"
  # Public URL served by the ALB. Laravel builds absolute URLs from this.
  url: "https://ticketing-dev.example.com"
  timezone: UTC
  locale: en

  # Drivers. See templates/configmap.yaml for why each one is what it is.
  sessionDriver: redis
  cacheStore: redis
  queueConnection: redis
  filesystemDisk: s3
  logChannel: stderr
  logLevel: info
  # The ALB terminates TLS and forwards X-Forwarded-*. Laravel must trust it or
  # every generated URL comes back http:// and the browser blocks mixed content.
  trustedProxies: "*"

  # Extra plain env vars merged into the ConfigMap.
  extraEnv: {}

# ------------------------------------------------------------------------------
# AWS / infrastructure endpoints (from `terraform -chdir=terraform/dev output`)
# ------------------------------------------------------------------------------
aws:
  region: ap-southeast-1
  accountId: "022499047467"

storage:
  # module.storage output bucket_id
  attachmentsBucket: ""

database:
  # Host, port, name, user and password are all read from the
  # ticketing-dev/database secret (JSON), so nothing is duplicated here.
  connection: mysql

redis:
  # module.cache output primary_endpoint_address
  host: ""
  port: 6379
  # ElastiCache is created with transit_encryption_enabled = true, so the client
  # must speak TLS. Leaving this false produces a connection reset that reads
  # like a firewall problem and is not.
  tls: true
  client: phpredis

  # ---- KEDA-critical. Read the comment in templates/scaledobject-worker.yaml. ----
  # Laravel namespaces every Redis key with this prefix. The queue list KEDA polls
  # is "<prefix>queues:<queue>", i.e. laravel_database_queues:default.
  prefix: "laravel_database_"
  queue: "default"

  # Logical DB index assignment - must match the build contract exactly.
  db:
    cache: 0
    sessions: 1
    queue: 2

# ------------------------------------------------------------------------------
# External Secrets Operator
# ------------------------------------------------------------------------------
externalSecrets:
  enabled: true
  # SecretStore (namespaced, not ClusterSecretStore) so the IRSA role stays
  # scoped to this namespace's ServiceAccount.
  storeName: ticketing-aws
  # Kubernetes Secret this chart materialises. Every workload reads from it.
  targetSecretName: ticketing-app
  refreshInterval: 1h
  # Dedicated in-namespace identity the SecretStore authenticates with (jwt auth).
  # NOT the app SA: the app SA carries the S3-only role and cannot read Secrets
  # Manager. This SA (created by templates/serviceaccount.yaml) carries the
  # read-only external_secrets role instead.
  serviceAccountName: ticketing-eso
  # module.eks output irsa_role_arns["external_secrets"] - read-only
  # secretsmanager:GetSecretValue/DescribeSecret on the four project secrets.
  # Filled from `terraform output irsa_role_arns.external_secrets` at install
  # time; deliberately empty here so no ARN is hardcoded in the chart.
  roleArn: ""
  # AWS Secrets Manager secret names - contract section "Secret NAMES".
  secrets:
    appKey: ticketing-dev/app-key
    database: ticketing-dev/database
    redisAuth: ticketing-dev/redis-auth
    smtp: ticketing-dev/smtp
  # Property inside ticketing-dev/redis-auth that holds the AUTH token.
  # The cache module writes JSON {host,port,password,scheme}, so the token lives
  # under `password`. Leave empty only if the secret is a raw string, not JSON.
  redisAuthProperty: password

mail:
  # Populated from the ticketing-dev/smtp secret; only the transport is static.
  mailer: smtp
  fromName: "Ticketing"

# ------------------------------------------------------------------------------
# web - nginx + php-fpm
# ------------------------------------------------------------------------------
web:
  replicas: 2
  # nginx listens on 8080, not 80: the container runs as non-root with ALL
  # capabilities dropped, so it cannot bind a privileged port.
  containerPort: 8080

  # Requests AND limits on every container. Without requests the HPA has no
  # baseline to compute utilisation against and silently reports <unknown>/70%,
  # i.e. it never scales and never tells you why.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    # Scale up fast, down slowly - PHP-FPM warm-up is cheap, flapping is not.
    stabilizationWindowSecondsUp: 30
    stabilizationWindowSecondsDown: 300

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # Preferred, NOT required. See templates/deployment-web.yaml.
  antiAffinity:
    enabled: true
    weight: 100
    topologyKey: topology.kubernetes.io/zone

  service:
    type: ClusterIP
    port: 80

  terminationGracePeriodSeconds: 30

  probes:
    liveness:
      path: /up
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /health/ready
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
    startup:
      path: /up
      periodSeconds: 5
      timeoutSeconds: 3
      # 30 x 5s = 150s of grace for composer/opcache warm-up on a cold Spot node.
      failureThreshold: 30

  nodeSelector:
    role: app
  tolerations: []
  extraEnv: {}

# ------------------------------------------------------------------------------
# worker - php artisan queue:work
# ------------------------------------------------------------------------------
worker:
  # Baseline only. KEDA owns the replica count from here on.
  replicas: 1

  queue: "default"
  tries: 3
  # --max-time bounds worker lifetime so a leaked connection or fragmented
  # PHP heap cannot survive forever.
  maxTime: 3600
  sleep: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # queue:work finishes the in-flight job on SIGTERM. 120s must exceed the
  # longest job or Kubernetes SIGKILLs mid-job and the job is lost.
  terminationGracePeriodSeconds: 120

  keda:
    enabled: true
    minReplicaCount: 1
    maxReplicaCount: 10
    pollingInterval: 15
    cooldownPeriod: 300
    # Target backlog per replica.
    listLength: 20
    # Backlog below which KEDA treats the scaler as inactive.
    activationListLength: 0

  nodeSelector:
    role: app
  tolerations: []
  extraEnv: {}

# ------------------------------------------------------------------------------
# scheduler - CronJob running php artisan schedule:run
# ------------------------------------------------------------------------------
scheduler:
  enabled: true
  schedule: "* * * * *"
  # Forbid: a minute-granularity cron whose run occasionally takes >60s must not
  # stack. Replace would kill the running job mid-task; Allow would pile up.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # If the controller was down, do not fire a backlog of missed runs; skip any
  # run more than 60s late.
  startingDeadlineSeconds: 60
  backoffLimit: 0
  activeDeadlineSeconds: 300
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector:
    role: app
  tolerations: []

# ------------------------------------------------------------------------------
# migrate - pre-install/pre-upgrade hook Job
# ------------------------------------------------------------------------------
migrate:
  enabled: true
  # 1 = one retry. Higher values retry a genuinely broken migration and delay the
  # failure signal; 0 gives up on a transient RDS failover.
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 300
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector:
    role: app
  tolerations: []

# ------------------------------------------------------------------------------
# Ingress - AWS Load Balancer Controller
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: alb
  host: "ticketing-dev.example.com"
  path: /
  pathType: Prefix
  scheme: internet-facing
  # ip targets register pod IPs directly with the target group - no extra hop,
  # and it is what makes the NetworkPolicy source an ALB ENI, not a node.
  targetType: ip
  # ACM certificate ARN in ap-southeast-1.
  certificateArn: ""
  healthcheckPath: /up
  sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
  # Must be >= web.terminationGracePeriodSeconds for zero-drop rollouts.
  deregistrationDelaySeconds: 30
  groupName: ""
  extraAnnotations: {}

# ------------------------------------------------------------------------------
# NetworkPolicy
# ------------------------------------------------------------------------------
# Requires ENABLE_NETWORK_POLICY=true on the VPC CNI addon (Terraform sets it in
# modules/eks). Without it these objects are accepted by the API server and
# enforced by nothing - a silent no-op that looks like a passing control.
networkPolicy:
  enabled: true
  # Namespace of the AWS Load Balancer Controller.
  ingressControllerNamespace: kube-system
  # Public subnet CIDRs that host the ALB ENIs (contract CIDR plan). With
  # target-type: ip the packet source is the ENI, not a controller pod.
  albSourceCidrs:
    - 10.42.0.0/20
    - 10.42.16.0/20
  # Private subnet CIDRs (contract CIDR plan) - RDS and ElastiCache live here.
  privateSubnetCidrs:
    - 10.42.32.0/19
    - 10.42.64.0/19
  # Namespace running CoreDNS.
  dnsNamespace: kube-system
  # Components subject to the egress policy.
  egressComponents:
    - web
    - worker
    - scheduler
    - migrate
  databasePort: 3306
  redisPort: 6379
  # Egress to AWS APIs (S3 via the gateway endpoint, Secrets Manager / STS / ECR
  # via interface endpoints).
  awsApis:
    enabled: true
    cidrs:
      - 0.0.0.0/0
    port: 443
  extraEgress: []

# ------------------------------------------------------------------------------
# Pod security - applies to every pod in this chart
# ------------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

# Extra labels/annotations applied to every object.
commonLabels: {}
commonAnnotations: {}
