{{- if .Values.externalSecrets.enabled }}
{{/*
  ExternalSecret - hook weight -10, i.e. after the SecretStore (-20) and before
  the migrate Job (0), so credentials exist by the time anything tries to use
  them. See templates/secretstore.yaml for the full ordering rationale.

  Every key is mapped explicitly rather than with dataFrom/extract. Explicit
  mapping means a renamed or missing property in AWS surfaces as a stuck
  ExternalSecret with a named key in its status, instead of a Kubernetes Secret
  that materialises with a silently missing entry and an app that starts with an
  empty password.

  Four AWS Secrets Manager secrets, per the build contract:
    ticketing-dev/app-key      raw string, the base64: APP_KEY
    ticketing-dev/database     JSON {username,password,host,port,dbname}
    ticketing-dev/redis-auth   ElastiCache AUTH token
    ticketing-dev/smtp         JSON {host,port,username,password,encryption,from_address}
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ticketing.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketing.labels" (dict "ctx" . "component" "secrets") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- include "ticketing.annotations" . | nindent 4 }}
spec:
  # Rotation in AWS propagates within this window. Pods do NOT pick up a rotated
  # value automatically - the env vars are read once at process start, so a
  # rotation still needs a rollout. Tracked as a known gap in the runbook.
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: SecretStore
  target:
    name: {{ .Values.externalSecrets.targetSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          {{- include "ticketing.labels" (dict "ctx" . "component" "secrets") | nindent 10 }}
  data:
    # --- Application key ------------------------------------------------------
    # Losing or changing APP_KEY invalidates every encrypted column and every
    # signed cookie. It is generated once by Terraform and never rotated casually.
    - secretKey: APP_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.appKey | quote }}

    # --- RDS MySQL ------------------------------------------------------------
    - secretKey: DB_HOST
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.database | quote }}
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.database | quote }}
        property: port
    - secretKey: DB_DATABASE
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.database | quote }}
        property: dbname
    - secretKey: DB_USERNAME
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.database | quote }}
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.database | quote }}
        property: password

    # --- ElastiCache AUTH token ----------------------------------------------
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.redisAuth | quote }}
        {{- with .Values.externalSecrets.redisAuthProperty }}
        property: {{ . | quote }}
        {{- end }}

    # --- SMTP -----------------------------------------------------------------
    # Terraform seeds this secret with placeholder JSON and ignores subsequent
    # changes, so a real value set out-of-band is not clobbered on the next apply.
    - secretKey: MAIL_HOST
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.smtp | quote }}
        property: host
    - secretKey: MAIL_PORT
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.smtp | quote }}
        property: port
    - secretKey: MAIL_USERNAME
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.smtp | quote }}
        property: username
    - secretKey: MAIL_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.smtp | quote }}
        property: password
    - secretKey: MAIL_ENCRYPTION
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.smtp | quote }}
        property: encryption
    - secretKey: MAIL_FROM_ADDRESS
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.smtp | quote }}
        property: from_address
{{- end }}
