{{- if .Values.networkPolicy.enabled }}
{{/*
  ============================================================================
  NetworkPolicy - requires ENABLE_NETWORK_POLICY=true on the VPC CNI addon.
  ============================================================================
  Terraform sets it in modules/eks (aws_eks_addon "vpc-cni", configuration_values
  ENABLE_NETWORK_POLICY = "true"). This matters more than it looks: without the
  flag the API server still accepts every object below, `kubectl get netpol`
  still lists them, and NOTHING enforces any of it. The control reads as passing
  in an audit while all traffic flows freely. If these policies are ever expected
  to be load-bearing, verify enforcement with a deliberately blocked connection,
  not by looking at the objects.
  ============================================================================
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ticketing.fullname" . }}-default-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketing.labels" (dict "ctx" . "component" "network") | nindent 4 }}
spec:
  # Empty podSelector = every pod in the namespace. Ingress only: egress is
  # governed by the dedicated policy further down, and denying egress here as
  # well would black-hole DNS before that policy is even evaluated.
  podSelector: {}
  policyTypes:
    - Ingress
  # No ingress rules = deny all ingress. Anything that should be reachable has to
  # be allowed explicitly below.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ticketing.fullname" . }}-allow-web-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketing.labels" (dict "ctx" . "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ticketing.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # (1) The AWS Load Balancer Controller's namespace. This covers the
        #     controller's own calls to the pods and any in-cluster ingress
        #     component that fronts them.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}

        # (2) The ALB ENIs themselves, by CIDR.
        #
        #     This entry is not optional and its absence is a classic outage.
        #     With alb.ingress.kubernetes.io/target-type: ip the load balancer
        #     talks to pod IPs DIRECTLY from its own elastic network interfaces
        #     in the public subnets. Those ENIs are not pods, so no
        #     namespaceSelector or podSelector can ever match them. A policy that
        #     allows only the ingress controller namespace therefore drops 100%
        #     of real user traffic and every ALB health check, while the
        #     controller itself keeps working - so the Ingress looks healthy, the
        #     target group goes all-unhealthy, and the ALB returns 502 with no
        #     corresponding error anywhere in the application logs.
        #
        #     Scoped to the two public subnet CIDRs from the build contract
        #     (10.42.0.0/20, 10.42.16.0/20) rather than the whole VPC, so private
        #     subnets get no implicit access to the web pods.
        {{- range .Values.networkPolicy.albSourceCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.web.containerPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ticketing.fullname" . }}-allow-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketing.labels" (dict "ctx" . "component" "network") | nindent 4 }}
spec:
  # web and worker are the workloads the brief names, but scheduler and migrate
  # run the same image against the same MySQL and Redis. Once ANY egress policy
  # selects a pod, that pod's egress is restricted to what the policy allows -
  # so omitting the scheduler and the migrate Job here would leave them
  # unrestricted (inconsistent) while omitting them from the selector after a
  # later default-deny-egress is added would break them outright. Listing all
  # four keeps the rule honest either way.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          {{- range .Values.networkPolicy.egressComponents }}
          - {{ . }}
          {{- end }}
  policyTypes:
    - Egress
  egress:
    # --- DNS ---------------------------------------------------------------
    # Both UDP and TCP on 53. UDP alone is the most common mistake here: it works
    # for months, then a response exceeds 512 bytes, the resolver retries over
    # TCP, that retry is dropped, and the symptom is an intermittent
    # "php_network_getaddresses: getaddrinfo failed" against an endpoint that
    # resolves perfectly from a debug pod.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # --- RDS MySQL ---------------------------------------------------------
    # The RDS instance lives in the private subnets, outside the cluster, so this
    # has to be expressed as a CIDR - there is no pod or namespace to select.
    - to:
        {{- range .Values.networkPolicy.privateSubnetCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.databasePort }}
        # --- ElastiCache Redis ---------------------------------------------
        # Same two private subnet CIDRs, so both ports are declared against the
        # same destination block.
        - protocol: TCP
          port: {{ .Values.networkPolicy.redisPort }}

    {{- if .Values.networkPolicy.awsApis.enabled }}
    # --- AWS APIs over HTTPS ----------------------------------------------
    # S3 (attachments, FILESYSTEM_DISK=s3), Secrets Manager, STS and ECR.
    #
    # 0.0.0.0/0 rather than the VPC CIDR, and that is not laziness. S3 is reached
    # through a GATEWAY endpoint: the route table sends the traffic onto the AWS
    # backbone, but the destination IP in the packet is still a public S3 address
    # from the com.amazonaws.ap-southeast-1.s3 prefix list. Narrowing this rule to
    # 10.42.0.0/16 breaks every attachment upload while leaving Secrets Manager
    # and STS (interface endpoints, private DNS, VPC IPs) working - so the failure
    # looks like an S3 permissions problem rather than a network one.
    - to:
        {{- range .Values.networkPolicy.awsApis.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.awsApis.port }}
    {{- end }}

    {{- with .Values.networkPolicy.extraEgress }}
    # --- Chart-supplied extras (e.g. SMTP on 587 to an external relay) -------
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
