{{- if .Values.serviceAccount.create }}
{{/*
  The ServiceAccount is a pre-install/pre-upgrade hook at weight -30, ahead of the
  SecretStore (-20) and the ExternalSecret (-10).

  It has to be. The SecretStore authenticates to AWS with `jwt` + `serviceAccountRef`
  pointing at THIS account, and the migrate Job at weight 0 mounts the Secret that
  External Secrets produces. A ServiceAccount created in the normal release phase
  would not exist until after every pre-install hook had already run, so the whole
  secret chain would fail on a first install and only succeed on the second.

  > Trade-off: Helm does not track hook resources in the release manifest, so
  > `helm uninstall` leaves this ServiceAccount behind. Deleting the namespace
  > removes it. That is a smaller price than an install that only works on retry.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ticketing.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketing.labels" (dict "ctx" . "component" "rbac") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- if .Values.serviceAccount.roleArn }}
    # IRSA. module.eks output irsa_role_arns["app"] - S3 Get/Put/Delete/List on the
    # attachments bucket only. The pod gets credentials from the projected token;
    # there is no access key anywhere in this chart.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
    eks.amazonaws.com/audience: sts.amazonaws.com
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- include "ticketing.annotations" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
{{- if .Values.externalSecrets.enabled }}
---
{{/*
  Dedicated identity for the External Secrets SecretStore (Seam 4).

  The app SA above carries irsa_role_arns["app"], which is scoped to S3 only and
  cannot read Secrets Manager. The SecretStore must authenticate as a SA whose
  IRSA role holds secretsmanager:GetSecretValue - that is the external_secrets
  role, whose trust policy is pinned to external-secrets:external-secrets AND
  ticketing:ticketing-eso. This SA is that second, in-namespace subject, so the
  namespaced SecretStore can assume the read-only secrets role WITHOUT widening
  the app SA beyond S3.

  Same hook weight (-30) as the app SA so it exists before the SecretStore (-20).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ticketing.fullname" . }}-eso
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketing.labels" (dict "ctx" . "component" "secrets") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- if .Values.externalSecrets.roleArn }}
    # IRSA. module.eks output irsa_role_arns["external_secrets"] - read-only
    # secretsmanager:GetSecretValue/DescribeSecret on the four project secrets.
    eks.amazonaws.com/role-arn: {{ .Values.externalSecrets.roleArn | quote }}
    eks.amazonaws.com/audience: sts.amazonaws.com
    {{- end }}
    {{- include "ticketing.annotations" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
