{{- if .Values.web.autoscaling.enabled }}
{{/*
  Requires metrics-server in the cluster. Without it the HPA sits at
  <unknown>/70% forever and reports FailedGetResourceMetric - the same visible
  symptom as a pod with no CPU request, and worth ruling out in that order.

  min 2 / max 4 matches the app node group (min 2 / max 4 t4g.medium SPOT), so the
  HPA can never ask for more capacity than the Cluster Autoscaler is allowed to
  provide.
*/}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ticketing.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketing.labels" (dict "ctx" . "component" "web") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ticketing.fullname" . }}-web
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          # Utilisation is a percentage of the CPU REQUEST (250m), not the limit.
          # 70% of 250m = 175m sustained before a new replica is added.
          type: Utilization
          averageUtilization: {{ .Values.web.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      # React quickly - a PHP-FPM pod is cheap to start and the cost of being
      # one replica short during a traffic spike is user-visible latency.
      stabilizationWindowSeconds: {{ .Values.web.autoscaling.stabilizationWindowSecondsUp }}
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      # Five minutes of sustained low CPU before removing a replica. Anything
      # shorter and a bursty workload oscillates between 2 and 4 replicas, which
      # costs more than simply keeping the replica.
      stabilizationWindowSeconds: {{ .Values.web.autoscaling.stabilizationWindowSecondsDown }}
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
{{- end }}
