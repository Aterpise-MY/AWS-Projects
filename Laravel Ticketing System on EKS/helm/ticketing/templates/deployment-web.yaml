apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ticketing.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketing.labels" (dict "ctx" . "component" "web") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  {{- /*
    replicas is deliberately omitted when the HPA is enabled. Setting both means
    every `helm upgrade` resets the replica count to the chart default and undoes
    whatever the HPA had decided, producing a visible traffic dip on every deploy.
  */}}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ticketing.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ticketing.labels" (dict "ctx" . "component" "web") | nindent 8 }}
      annotations:
        # Roll the pods when plain config changes. ConfigMap updates are not
        # picked up by a running PHP-FPM process, so without this a config change
        # applies to new pods only and the fleet ends up half-configured.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ticketing.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Must be >= the ALB target group deregistration delay, otherwise the pod
      # is killed while the ALB is still sending it requests and users see 502s.
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.web.antiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          # preferredDuringSchedulingIgnoredDuringExecution, NOT required.
          #
          # This cluster has exactly two AZs (ap-southeast-1a, ap-southeast-1b)
          # and the web Deployment scales to 4 replicas. With
          # requiredDuringSchedulingIgnoredDuringExecution and a zone topologyKey,
          # only one replica could ever be placed per zone, so replicas 3 and 4
          # would sit Pending forever - the HPA would keep raising the desired
          # count, nothing new would ever become Ready, and the only symptom would
          # be "0/2 nodes are available: node(s) didn't match pod anti-affinity
          # rules" buried in an event.
          #
          # Preferred gets the same spread at 2 replicas (one per AZ, which is the
          # part that actually matters for AZ failure) and degrades to co-location
          # once the zones are exhausted instead of refusing to schedule.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .Values.web.antiAffinity.weight }}
              podAffinityTerm:
                topologyKey: {{ .Values.web.antiAffinity.topologyKey }}
                labelSelector:
                  matchLabels:
                    {{- include "ticketing.selectorLabels" (dict "ctx" . "component" "web") | nindent 20 }}
            # Secondary, lower weight: also try not to stack two replicas on the
            # same node. Relevant because the app node group is SPOT - one
            # reclaimed node should not take the whole zone's capacity with it.
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "ticketing.selectorLabels" (dict "ctx" . "component" "web") | nindent 20 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "ticketing.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              # 8080, not 80. runAsNonRoot + capabilities.drop: [ALL] removes
              # CAP_NET_BIND_SERVICE, so nginx cannot bind a port below 1024.
              containerPort: {{ .Values.web.containerPort }}
              protocol: TCP
          envFrom:
            {{- include "ticketing.envFrom" . | nindent 12 }}
          env:
            {{- include "ticketing.podEnv" . | nindent 12 }}
            {{- range $key, $value := .Values.web.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}

          # --- Probes -----------------------------------------------------------
          # startupProbe first: it suppresses liveness and readiness entirely
          # until the app has booted once. Without it, a cold start on a Spot
          # node that takes longer than the liveness failureThreshold gets the
          # container killed and restarted forever - a crash loop caused purely
          # by an impatient probe.
          startupProbe:
            httpGet:
              path: {{ .Values.web.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.web.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.web.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.web.probes.startup.failureThreshold }}

          # Liveness answers "is this PHP process wedged?" and nothing else, so
          # it hits /up - a static route with no database and no Redis call.
          livenessProbe:
            httpGet:
              path: {{ .Values.web.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.web.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.web.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.web.probes.liveness.failureThreshold }}

          # Readiness checks dependencies (/health/ready touches MySQL and Redis)
          # and is the ONLY probe allowed to do so.
          #
          # Why the dependency check must never be on the liveness probe: if RDS
          # fails over or Redis briefly stalls, every replica fails the check at
          # the same moment. On a liveness probe that means Kubernetes restarts
          # the entire fleet simultaneously - and the restarted pods then stampede
          # the recovering database with fresh connection storms and cold caches,
          # turning a 30-second blip into a full outage that outlives its own
          # cause. On a readiness probe the pods are merely pulled out of the ALB
          # target group, keep their warm state, and re-register the moment the
          # dependency answers again. Restarting a process never fixes someone
          # else's database.
          readinessProbe:
            httpGet:
              path: {{ .Values.web.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.web.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.web.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.web.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.web.probes.readiness.successThreshold }}

          lifecycle:
            preStop:
              exec:
                # Give the ALB time to deregister this pod before nginx stops
                # accepting connections. Kubernetes removes the endpoint and
                # sends SIGTERM concurrently, so without the pause a small number
                # of in-flight requests are always dropped on every rollout.
                command: ["/bin/sh", "-c", "sleep 15"]

          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}

          # Requests AND limits, both mandatory.
          # The HPA computes utilisation as (current usage / CPU REQUEST). With no
          # request there is no denominator: the HPA reports targets as
          # <unknown>/70%, refuses to scale, and logs nothing at default verbosity.
          # It looks like a working autoscaler that simply never has to act.
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}

          volumeMounts:
            {{- include "ticketing.writableVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "ticketing.writableVolumes" . | nindent 8 }}
