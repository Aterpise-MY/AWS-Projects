apiVersion: v1
kind: Service
metadata:
  name: {{ include "ticketing.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketing.labels" (dict "ctx" . "component" "web") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # ClusterIP even though an ALB fronts it. With target-type: ip the AWS Load
  # Balancer Controller reads the Service's endpoints to discover pod IPs and
  # registers them directly; it never routes through the Service's cluster IP,
  # so there is nothing to gain from NodePort or LoadBalancer here.
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "ticketing.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
