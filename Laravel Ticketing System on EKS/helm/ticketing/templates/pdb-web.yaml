{{- if .Values.web.podDisruptionBudget.enabled }}
{{/*
  minAvailable: 1, not maxUnavailable: 1.

  The app node group is SPOT and the HPA can take the Deployment down to 2
  replicas. Expressed as minAvailable, the budget still guarantees one serving
  pod at the floor. Expressed as maxUnavailable: 1 the guarantee is identical at
  2 replicas but weakens as the fleet grows, and at minReplicas it is the same
  number written in a way that hides the intent.

  This constrains VOLUNTARY disruption only - node drains from Spot rebalance
  recommendations, Cluster Autoscaler scale-in, and `kubectl drain` during an EKS
  upgrade. A Spot interruption that reclaims the instance outright, or a node that
  simply dies, ignores the budget entirely; the pod anti-affinity in
  deployment-web.yaml is what covers that case.

  > minAvailable: 1 with maxReplicas: 4 means up to 3 pods can be drained at once.
  > That is intentional for a dev environment. Production should raise this in step
  > with the replica floor.
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ticketing.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketing.labels" (dict "ctx" . "component" "web") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "ticketing.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
{{- end }}
