{{- if .Values.ingress.enabled }}
{{- $fullName := include "ticketing.fullname" . -}}
{{- $cert := required "ingress.certificateArn is required when ingress.enabled - an internet-facing ALB with no ACM certificate would serve the application over plain HTTP" .Values.ingress.certificateArn -}}
{{/*
  Provisioned by the AWS Load Balancer Controller (installed cluster-wide, not by
  this chart). The controller reconciles this object into a real ALB, target
  groups, listeners and listener rules.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketing.labels" (dict "ctx" . "component" "web") | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.scheme }}

    # ip targets register pod IPs in the target group directly. instance targets
    # would hop through a NodePort and kube-proxy, adding a hop, losing the true
    # client IP at the node, and making pod-level readiness invisible to the ALB.
    alb.ingress.kubernetes.io/target-type: {{ .Values.ingress.targetType }}

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ $cert | quote }}
    alb.ingress.kubernetes.io/ssl-policy: {{ .Values.ingress.sslPolicy }}
    alb.ingress.kubernetes.io/backend-protocol: HTTP

    # HTTP -> HTTPS redirect, declared as an explicit ALB action rather than a
    # backend service. The redirect is executed by the load balancer itself, so a
    # plain-HTTP request never reaches a pod - no PHP process is spent on it and
    # no session cookie is ever transmitted in clear.
    alb.ingress.kubernetes.io/actions.ssl-redirect: >-
      {"Type": "redirect", "RedirectConfig": {"Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}

    # Health check hits /up - static, no database, no Redis. The ALB must keep a
    # target registered while its dependencies are briefly unavailable; the
    # Kubernetes readiness probe on /health/ready is what pulls the pod out of
    # rotation in that case, and it can do so without the ALB also deregistering
    # every target at once.
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.healthcheckPath }}
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200"

    # Deregistration delay must be <= the pod terminationGracePeriodSeconds (30s)
    # or the ALB is still draining a target that Kubernetes has already killed.
    alb.ingress.kubernetes.io/target-group-attributes: >-
      deregistration_delay.timeout_seconds={{ .Values.ingress.deregistrationDelaySeconds }},
      load_balancing.algorithm.type=least_outstanding_requests

    # Pod readiness gates: the controller injects a gate so a pod is not counted
    # Ready until its ALB target is healthy. Without it a rolling update can
    # complete before the new targets are in service and briefly serve 502s.
    alb.ingress.kubernetes.io/load-balancer-attributes: >-
      idle_timeout.timeout_seconds=60,
      routing.http2.enabled=true,
      routing.http.drop_invalid_header_fields.enabled=true

    alb.ingress.kubernetes.io/tags: >-
      Project=ticketing,Environment={{ .Values.app.env }},ManagedBy=helm,Component=web
    {{- if .Values.ingress.groupName }}
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.groupName }}
    {{- end }}
    {{- with .Values.ingress.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- include "ticketing.annotations" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Rule order matters - the ALB evaluates listener rules in order. The
          # redirect action must come first; the controller scopes it to the
          # HTTP:80 listener automatically.
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: ssl-redirect
                port:
                  name: use-annotation
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ $fullName }}-web
                port:
                  name: http
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
{{- end }}
