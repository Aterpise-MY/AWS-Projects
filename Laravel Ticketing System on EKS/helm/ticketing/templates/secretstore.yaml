{{- if .Values.externalSecrets.enabled }}
{{/*
  SecretStore - hook weight -20.

  Ordering across the whole secret chain:

    -30  ServiceAccount     (IRSA identity the store authenticates with)
    -20  SecretStore        (this file - how to reach AWS Secrets Manager)
    -10  ExternalSecret     (what to pull, and into which Kubernetes Secret)
      0  migrate Job        (first consumer of that Secret)

  Get the order wrong and the migrate Job starts with no DB_PASSWORD, fails
  authentication against RDS, and the failure reads like a credentials problem
  rather than a sequencing one.

  > This is a namespaced SecretStore, not a ClusterSecretStore, on purpose: it
  > authenticates as the dedicated ticketing-eso SA, whose IRSA role
  > (irsa_role_arns["external_secrets"]) is trust-scoped to
  > system:serviceaccount:ticketing:ticketing-eso, so the store is only usable
  > from this namespace anyway. A ClusterSecretStore would advertise cluster-wide
  > access it does not actually have. Note this is NOT the app SA (ticketing),
  > which carries the S3-only role and cannot read Secrets Manager.

  > Cleaner factoring: the SecretStore is really platform plumbing, not
  > application config. Moving it (with the operator itself) into a separate
  > platform chart owned by the cluster team would let application releases stop
  > carrying a controller-specific CRD, and would stop every app chart from
  > re-declaring the same AWS provider block. It lives here because this chart is
  > currently the only consumer and the hook ordering above has to hold.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.storeName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketing.labels" (dict "ctx" . "component" "secrets") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- include "ticketing.annotations" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.aws.region }}
      auth:
        # IRSA. The operator exchanges the projected ServiceAccount token for
        # AWS credentials via STS - no static access key exists anywhere.
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccountName }}
            namespace: {{ .Release.Namespace }}
{{- end }}
