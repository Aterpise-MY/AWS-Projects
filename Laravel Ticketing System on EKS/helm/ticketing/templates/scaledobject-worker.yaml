{{- if .Values.worker.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "ticketing.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketing.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ticketing.fullname" . }}-worker
  minReplicaCount: {{ .Values.worker.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.worker.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.worker.keda.pollingInterval }}
  # Wait this long after the last scaling activity before returning to
  # minReplicaCount. Must comfortably exceed the longest job so a scale-in does
  # not repeatedly evict workers that are still busy.
  cooldownPeriod: {{ .Values.worker.keda.cooldownPeriod }}
  advanced:
    # Leave the generated HPA in place on delete; KEDA cleans it up itself.
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 4
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
  triggers:
    - type: redis
      metadata:
        address: {{ printf "%s:%v" .Values.redis.host .Values.redis.port | quote }}

        # ====================================================================
        # THE KEY. Read this before changing anything above or below it.
        # ====================================================================
        # Laravel does not store its queue under "default". It namespaces every
        # Redis key with REDIS_PREFIX, so the list this worker actually reads is
        #
        #     <REDIS_PREFIX>queues:<queue>   ->   laravel_database_queues:default
        #
        # Point the scaler at "default", "queues:default", or any other guess and
        # nothing breaks loudly. Redis returns 0 for LLEN on a key that does not
        # exist, KEDA reads that as an empty queue, the ScaledObject reports
        # Ready/Active=False, and the worker Deployment sits at minReplicaCount
        # forever while the real backlog grows without bound. There is no error
        # in the KEDA operator log, no event on the ScaledObject, and the metric
        # graph is a flat line at zero that looks exactly like a healthy idle
        # queue. The first symptom is a user asking why their ticket email never
        # arrived.
        #
        # Templated from .Values.redis.prefix and .Values.redis.queue so this key
        # and the REDIS_PREFIX the application uses cannot drift apart. Never
        # hardcode it.
        #
        # The runbook records the value verified against the live cluster with:
        #     redis-cli KEYS "*queues*"
        # run from a debug pod against the ElastiCache primary endpoint. That
        # output is the source of truth - if it disagrees with the rendered value
        # below, the chart is wrong, not Redis.
        listName: {{ include "ticketing.queueListName" . | quote }}

        # Same trap, second half: the queue lives on Redis logical DB 2 (build
        # contract - 0 cache, 1 sessions, 2 queue). KEDA defaults to DB 0, where
        # this key does not exist, and fails in exactly the same silent way.
        databaseIndex: {{ .Values.redis.db.queue | quote }}

        # Target backlog per replica. KEDA scales towards
        # ceil(LLEN / listLength), bounded by max/minReplicaCount.
        listLength: {{ .Values.worker.keda.listLength | quote }}
        # Below this the trigger is inactive and KEDA returns to minReplicaCount.
        activationListLength: {{ .Values.worker.keda.activationListLength | quote }}

        # ElastiCache has transit_encryption_enabled = true. With enableTLS
        # false the scaler cannot connect at all - which at least fails visibly,
        # unlike the wrong key.
        enableTLS: {{ .Values.redis.tls | quote }}

        # KEDA resolves this from the scale target's own pod spec, i.e. the
        # REDIS_PASSWORD secretKeyRef on the worker container. One definition of
        # the credential, used by both the worker and the scaler.
        passwordFromEnv: REDIS_PASSWORD
{{- end }}
