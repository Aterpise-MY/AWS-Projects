# ==============================================================================
# external-secrets-operator - syncs AWS Secrets Manager into Kubernetes secrets
# ==============================================================================
# Chart: external-secrets/external-secrets
# Namespace: external-secrets  ServiceAccount: external-secrets
# IRSA: irsa_role_arns["external_secrets"] - secretsmanager:GetSecretValue +
#       DescribeSecret on the four ticketing-dev/* secrets ONLY.
#
# The ticketing chart ships the SecretStore + ExternalSecret objects; this
# operator is the controller that reconciles them. The redis exporter and
# Alertmanager also depend on it to materialise their secrets. Install BEFORE
# the ticketing release and before the exporters.
# ==============================================================================

serviceAccount:
  create: true
  name: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_ME_irsa_role_arns_external_secrets"

# Pin all three sub-deployments (controller, webhook, cert-controller) to the
# system node group.
nodeSelector:
  role: system
tolerations:
  - key: CriticalAddonsOnly
    operator: Equal
    value: "true"
    effect: NoSchedule
webhook:
  nodeSelector:
    role: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule
certController:
  nodeSelector:
    role: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

# Prometheus scraping of the operator's reconcile metrics.
serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
