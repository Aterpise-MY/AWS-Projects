# ==============================================================================
# aws-for-fluent-bit - application logs to CloudWatch Logs
# ==============================================================================
# Chart: eks/aws-for-fluent-bit
# Namespace: amazon-cloudwatch  ServiceAccount: fluent-bit
# IRSA: irsa_role_arns["fluent_bit"] (CloudWatch Logs create/put per contract)
#
# WHY CloudWatch Logs and not Loki:
#   Loki would be the better long-term home - cheaper at high volume, native
#   LogQL, and it lives next to Grafana so logs and metrics share one pane.
#   BUT Loki is another stateful workload to run, back up and babysit (ingester,
#   compactor, an object-store bucket, a schema config). For a SINGLE dev
#   environment at this log volume, CloudWatch Logs is fewer moving parts, no
#   PVCs, and cheaper than paying for a Loki footprint that mostly sits idle.
#   The trade we accept: no LogQL, and querying is via CloudWatch Logs Insights.
#   Revisit Loki when there is more than one environment or log volume climbs.
# ==============================================================================

serviceAccount:
  create: true
  name: fluent-bit
  annotations:
    # module.eks output irsa_role_arns["fluent_bit"].
    eks.amazonaws.com/role-arn: "REPLACE_ME_irsa_role_arns_fluent_bit"

# Fluent Bit runs as a DaemonSet on every node (it tails container logs off the
# node filesystem), so it must tolerate BOTH node groups, including the tainted
# system node. This is the one platform component that is intentionally not
# pinned to role=system.
tolerations:
  - operator: Exists

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# We supply the full pipeline explicitly rather than using the chart's cloudWatch
# convenience block, so the JSON parsing and correlation-id handling are visible.
input: |
  [INPUT]
      Name                tail
      Tag                 ticketing.*
      Path                /var/log/containers/*ticketing*.log
      # containerd/CRI log lines are wrapped; unwrap them first, then the
      # laravel_json parser (below) reads the embedded structured log.
      multiline.parser    cri
      DB                  /var/log/flb_ticketing.db
      Mem_Buf_Limit       25MB
      Skip_Long_Lines     On
      Refresh_Interval    10

filter: |
  [FILTER]
      Name                kubernetes
      Match               ticketing.*
      Merge_Log           On
      Keep_Log            Off
      K8S-Logging.Parser  On
      K8S-Logging.Exclude On
      Labels              On
      Annotations         Off
  # Laravel writes ONE JSON object per line to stderr (LOG_CHANNEL=stderr,
  # monolog JSON formatter). Merge_Log On already parsed it into structured
  # fields. This filter guarantees the request correlation id survives: Laravel
  # is configured to log the ALB's X-Amzn-Trace-Id as `trace_id`, so log lines
  # can be joined to an ALB access-log entry end to end. If the field is absent
  # (e.g. a boot log before the request context exists) we leave it unset rather
  # than inventing one.
  [FILTER]
      Name                modify
      Match               ticketing.*
      Rename              x_amzn_trace_id trace_id
      Hard_rename         Off

output: |
  [OUTPUT]
      Name                cloudwatch_logs
      Match               ticketing.*
      region              ap-southeast-1
      log_group_name      /ticketing-dev/application
      # One CloudWatch log stream per pod so streams stay readable.
      log_stream_prefix   pod-
      auto_create_group   On
      # 7-DAY RETENTION. Set on the group at creation. Matches the Prometheus
      # 7d retention and the EKS control-plane log retention: nothing in this
      # dev stack keeps observability data longer than a week, by design.
      log_retention_days  7
      # Preserve the structured JSON fields as top-level log event attributes so
      # CloudWatch Logs Insights can query `fields trace_id, level, message`.
      log_key             log

# The chart also lays down a laravel-oriented parser set; the JSON parser is the
# one that matters. Merge_Parser reads Laravel's monolog JSON.
service: |
  [SERVICE]
      Flush               5
      Grace               30
      Log_Level           info
      Daemon              off
      Parsers_File        /fluent-bit/etc/parsers.conf
      HTTP_Server         On
      HTTP_Listen         0.0.0.0
      HTTP_Port           2020

# Expose Fluent Bit's own metrics endpoint so Prometheus can confirm the log
# pipeline is alive (dropped records, retries).
serviceMonitor:
  enabled: true
  namespace: amazon-cloudwatch
  interval: 30s
  additionalLabels:
    release: kube-prometheus-stack
