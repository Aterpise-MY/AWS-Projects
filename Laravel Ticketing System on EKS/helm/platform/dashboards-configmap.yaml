# ==============================================================================
# Grafana dashboard ConfigMaps - how JSON-as-code reaches Grafana
# ==============================================================================
# The kube-prometheus-stack Grafana sidecar (enabled in
# kube-prometheus-stack.values.yaml) watches ALL namespaces for ConfigMaps
# carrying the label grafana_dashboard: "1". When it sees one, it writes each
# data key to Grafana's provisioning directory and Grafana imports it. That is
# the entire mechanism that makes the JSON files in ./dashboards/ survive a
# `terraform destroy` + rebuild: they live in git, become ConfigMaps, and the
# sidecar re-imports them on every fresh Grafana pod.
#
# The `grafana_folder` annotation (folderAnnotation in the sidecar config)
# groups the dashboards under a "Ticketing" folder in the Grafana UI.
#
# ------------------------------------------------------------------------------
# Two ways to produce these ConfigMaps
# ------------------------------------------------------------------------------
# 1. GENERATE from the JSON files (recommended - no copy/paste, no drift):
#
#      kubectl -n monitoring create configmap ticketing-dashboards \
#        --from-file=dashboards/ \
#        --dry-run=client -o yaml \
#      | kubectl label -f - --local -o yaml --dry-run=client \
#          grafana_dashboard=1 \
#      | kubectl apply -f -
#      kubectl -n monitoring annotate configmap ticketing-dashboards \
#        grafana_folder=Ticketing --overwrite
#
#    Or with kustomize, which keeps the label/annotation in code:
#
#      # kustomization.yaml
#      configMapGenerator:
#        - name: ticketing-dashboards
#          namespace: monitoring
#          files:
#            - dashboards/ticketing-queues-jobs.json
#            - dashboards/ticketing-http.json
#            - dashboards/ticketing-rds.json
#      generatorOptions:
#        labels:
#          grafana_dashboard: "1"
#        annotations:
#          grafana_folder: Ticketing
#
# 2. HAND-WRITTEN ConfigMap (shown below for ONE dashboard so the shape is
#    unambiguous). The JSON goes under data.<filename> as a literal block.
#    In practice prefer option 1 so the JSON exists in exactly one place.
# ------------------------------------------------------------------------------
#
# The manifest below is illustrative: the `...` marks where the full contents of
# dashboards/ticketing-rds.json would be pasted. Do NOT apply it as-is with the
# placeholder; use option 1 to fill it from the file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketing-dashboard-rds
  namespace: monitoring
  labels:
    # THIS is the label the sidecar keys on. Value must be the string "1".
    grafana_dashboard: "1"
  annotations:
    # Places the dashboard in a Grafana folder instead of "General".
    grafana_folder: Ticketing
data:
  ticketing-rds.json: |
    { "PASTE dashboards/ticketing-rds.json HERE - or generate via option 1": true }
