# ==============================================================================
# kube-prometheus-stack - values for the ticketing-dev cluster
# ==============================================================================
# Chart: prometheus-community/kube-prometheus-stack
# Installs: Prometheus Operator, Prometheus, Alertmanager, Grafana,
#           kube-state-metrics and node-exporter.
#
# This file is SIZED FOR A SINGLE DEV ENVIRONMENT on a 2-node-group cluster
# (1x t4g.small system node, 2-4x t4g.medium Spot app nodes). It deliberately
# trades durability and alert breadth for cost. Read the comments before
# copying any of this to a production cluster.
#
# Install order note: this stack must be installed AFTER metrics-server, the
# EBS CSI driver addon and cert-manager are healthy. See README.md.
# ==============================================================================

# ------------------------------------------------------------------------------
# Global
# ------------------------------------------------------------------------------
# Placeholder. Set at install time from `terraform -chdir=terraform/dev output`.
# Used only in external labels so Grafana/Alertmanager can name the source.
commonLabels:
  cluster: ticketing-dev

# ==============================================================================
# Prometheus
# ==============================================================================
prometheus:
  prometheusSpec:
    # --------------------------------------------------------------------------
    # Retention and storage
    # --------------------------------------------------------------------------
    # 7-day retention with NO persistent volume. This is an EXPLICIT EBS-cost
    # trade: a gp3 PVC large enough for TSDB would run ~USD 1-2/mo per GB and
    # would survive restarts. We accept that a Prometheus pod restart (Spot
    # reclaim, node roll, chart upgrade) LOSES ALL HISTORY back to empty.
    # For a single dev environment where alerts fire in real time and nobody
    # queries week-old data, that is the right call. Flip storageSpec back on
    # the day this cluster stops being disposable.
    retention: 7d
    retentionSize: ""
    # storageSpec intentionally omitted -> Prometheus writes TSDB to an emptyDir
    # backed by the node. Restart == fresh start.

    # --------------------------------------------------------------------------
    # Scheduling: pin to the system node group
    # --------------------------------------------------------------------------
    # The system node carries CriticalAddonsOnly=true:NoSchedule. Platform
    # add-ons run here so a Spot reclaim on the app group never takes out
    # monitoring at the same moment the app is churning.
    nodeSelector:
      role: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Equal
        value: "true"
        effect: NoSchedule

    # --------------------------------------------------------------------------
    # Resources - requests AND limits (contract requirement)
    # --------------------------------------------------------------------------
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 750m
        memory: 1Gi

    # --------------------------------------------------------------------------
    # Selectors: adopt rules/monitors regardless of Helm release label.
    # --------------------------------------------------------------------------
    # By default the operator only picks up PrometheusRule / ServiceMonitor
    # objects carrying `release: <this release>`. Our exporters and the
    # prometheus-rules.yaml PrometheusRule are installed as separate releases,
    # so we relax the selectors to cluster-wide discovery. In a multi-tenant
    # prod cluster you would NOT do this - you would label every rule instead.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

    # Scrape interval relaxed to 30s: at dev scale nothing needs 15s resolution
    # and it halves TSDB churn on the emptyDir.
    scrapeInterval: 30s
    evaluationInterval: 30s

# ==============================================================================
# Alertmanager
# ==============================================================================
# Routing/receivers live in alertmanager.values.yaml (installed via the same
# release with -f). Here we only handle placement and resources; storage is
# emptyDir for the same disposability reason as Prometheus.
alertmanager:
  alertmanagerSpec:
    nodeSelector:
      role: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Equal
        value: "true"
        effect: NoSchedule
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# ==============================================================================
# Grafana
# ==============================================================================
grafana:
  # Admin password: DO NOT set a literal here. Supply at install time from a
  # pre-created Kubernetes secret. Left empty so a plaintext password can never
  # be committed. Example install:
  #   --set grafana.admin.existingSecret=grafana-admin
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # No persistence: dashboards are code (see the sidecar below), so a Grafana
  # restart re-imports everything from ConfigMaps. Nothing of value lives on
  # Grafana's disk. Users/orgs created in the UI are lost on restart - by
  # design, provision them as code if you need them.
  persistence:
    enabled: false

  nodeSelector:
    role: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

  # --------------------------------------------------------------------------
  # Sidecar: dashboard + datasource discovery via ConfigMap labels.
  # --------------------------------------------------------------------------
  # This is the mechanism that makes "dashboards as code" work. The sidecar
  # watches every namespace for ConfigMaps labelled grafana_dashboard="1" and
  # loads the JSON they contain into Grafana. A dashboard that only exists in
  # someone's browser does not survive `terraform destroy`; a dashboard in a
  # git-committed ConfigMap does. See dashboards-configmap.yaml.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      # Route JSON into folders by a second label if present.
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL

  # The in-cluster Prometheus is wired as the default datasource automatically
  # by the chart. YACE and the redis exporter are scraped BY that Prometheus,
  # so they appear as metrics, not as separate Grafana datasources.

# ==============================================================================
# kube-state-metrics / node-exporter - pin resources, leave defaults otherwise
# ==============================================================================
kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ==============================================================================
# Default rule tuning - silence what is unreachable on EKS
# ==============================================================================
# On EKS the control plane is AWS-managed: the API server, etcd, scheduler and
# controller-manager are NOT exposed as scrape targets, and kube-proxy metrics
# are frequently unreachable depending on the CNI/proxy mode. The stock
# kube-prometheus-stack rules for those components therefore fire CONTINUOUSLY
# with "target down" / "no data" on every EKS cluster. Constant false alerts
# are the single most common reason a team stops reading dev alerts entirely,
# so we disable the rule groups that can never be satisfied here. The four
# alerts we actually care about live in prometheus-rules.yaml.
defaultRules:
  create: true
  rules:
    etcd: false                    # etcd is inside the AWS-managed control plane
    kubeScheduler: false           # not a scrapable target on EKS
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false   # not a scrapable target on EKS
    kubeProxy: false               # metrics endpoint unreliable under VPC CNI
    kubeApiserverAvailability: false  # managed; SLO burn alerts are noise in dev
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false

# These control-plane scrape jobs point at endpoints that do not exist on EKS.
# Leaving them enabled produces permanently-down targets in the Targets page.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
