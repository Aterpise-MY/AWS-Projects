# ==============================================================================
# aws-load-balancer-controller - provisions the ALB for the ticketing Ingress
# ==============================================================================
# Chart: eks/aws-load-balancer-controller
# Namespace: kube-system  ServiceAccount: aws-load-balancer-controller
# IRSA: irsa_role_arns["alb_controller"] (official ALB controller policy)
#
# Install order: FIRST of the platform add-ons. The ticketing chart's Ingress is
# inert until this controller exists to reconcile it into a real ALB.
# ==============================================================================

# Templated from `terraform -chdir=terraform/dev output cluster_name`.
clusterName: ticketing-dev

serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_ME_irsa_role_arns_alb_controller"

# Region + VPC let the controller skip IMDS lookups and start faster.
region: ap-southeast-1
vpcId: "REPLACE_ME_vpc_id"

# Run on the system node group with the rest of the platform.
nodeSelector:
  role: system
tolerations:
  - key: CriticalAddonsOnly
    operator: Equal
    value: "true"
    effect: NoSchedule

# Two replicas so a Spot reclaim of the app group never leaves the Ingress
# unreconciled; leader election picks one active.
replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Expose controller metrics to Prometheus.
serviceMonitor:
  enabled: true
  namespace: kube-system
  additionalLabels:
    release: kube-prometheus-stack
