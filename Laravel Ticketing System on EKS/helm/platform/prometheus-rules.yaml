# ==============================================================================
# PrometheusRule - the ONLY four alerts this dev environment fires
# ==============================================================================
# Kept deliberately tiny. Every alert here describes a condition a human should
# act on within minutes; nothing here is informational. Each rule carries a
# `severity` and a `runbook_url` annotation that deep-links to the matching
# anchor in docs/runbook.md. An alert with no runbook entry is not "done".
#
# The `release: kube-prometheus-stack` label is what the Prometheus Operator's
# default ruleSelector matches on. We also relaxed ruleSelectorNilUsesHelmValues
# in kube-prometheus-stack.values.yaml so this is belt-and-braces.
#
# Metric provenance:
#   redis_key_size{...}          -> prometheus-redis-exporter (check-keys)
#   kube_pod_container_status_*  -> kube-state-metrics (bundled with the stack)
#   aws_rds_database_connections -> yet-another-cloudwatch-exporter (YACE)
# ==============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ticketing-dev-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: ticketing-platform
    # Matched by the operator's ruleSelector.
    release: kube-prometheus-stack
spec:
  groups:
    - name: ticketing.rules
      rules:
        # ----------------------------------------------------------------------
        # 1. Queue backlog above 100 for 5 minutes
        # ----------------------------------------------------------------------
        # The default Laravel queue is the load-bearing path in a ticketing
        # system: notifications, mail, webhooks all flow through it. A backlog
        # that stays above 100 for 5 minutes means the workers are not keeping
        # up (Spot reclaim, a poison job, Redis latency). KEDA should already be
        # scaling workers up; if this fires, KEDA is not winning.
        - alert: TicketingQueueBacklogHigh
          expr: redis_key_size{key="laravel_database_queues:default"} > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Default queue backlog above 100 for 5m"
            description: >-
              Redis list laravel_database_queues:default has
              {{ $value | printf "%.0f" }} pending jobs (threshold 100) for over
              5 minutes. Workers are not draining the queue fast enough.
            runbook_url: "https://github.com/brendonang/ticketing-platform/blob/main/docs/runbook.md#queue-backlog-high"

        # ----------------------------------------------------------------------
        # 2. Any pod in CrashLoopBackOff
        # ----------------------------------------------------------------------
        # Catches the whole namespace, not just one workload: a crash-looping
        # web, worker, scheduler or migrate pod all matter. kube-state-metrics
        # publishes the waiting reason; we look back 5m so a single transient
        # restart during a rollout does not page.
        - alert: TicketingPodCrashLooping
          expr: |
            max_over_time(
              kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]
            ) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} in CrashLoopBackOff"
            description: >-
              Container {{ $labels.container }} in pod
              {{ $labels.namespace }}/{{ $labels.pod }} has been restarting in a
              CrashLoopBackOff for at least 5 minutes.
            runbook_url: "https://github.com/brendonang/ticketing-platform/blob/main/docs/runbook.md#pod-crashloopbackoff"

        # ----------------------------------------------------------------------
        # 3. RDS connections above 70% of max_connections
        # ----------------------------------------------------------------------
        # db.t4g.micro has ~1 GiB RAM, so MySQL's default max_connections
        # formula ({DBInstanceClassMemory/12582880}) lands at ~85. This is the
        # metric most likely to catch a real failure before users do: a
        # connection leak or a worker fan-out exhausts the pool long before CPU
        # or memory look unhealthy. 70% of 85 = ~60.
        #
        # NOTE: max_connections is NOT a CloudWatch metric, so 85 is a literal
        # here. The measured value MUST be confirmed post-deploy with
        # `SHOW VARIABLES LIKE 'max_connections';` and recorded in the runbook;
        # update the 85 below if the parameter group changes it.
        - alert: TicketingRDSConnectionsHigh
          expr: aws_rds_database_connections_maximum > (85 * 0.70)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "RDS connections above 70% of max_connections"
            description: >-
              RDS instance is using {{ $value | printf "%.0f" }} connections,
              over 70% of the ~85 max_connections ceiling for db.t4g.micro.
              Connection exhaustion causes app-wide 'too many connections'
              errors. Check for a leak or unbounded worker scaling.
            runbook_url: "https://github.com/brendonang/ticketing-platform/blob/main/docs/runbook.md#rds-connections-high"

        # ----------------------------------------------------------------------
        # 4. Failed job count increasing over 15 minutes
        # ----------------------------------------------------------------------
        # A steadily rising failed-job count means jobs are dying faster than
        # anyone is retrying them - a bad deploy, a downstream outage, or a
        # data bug. We alert on the INCREASE, not the absolute count, so old
        # historical failures do not keep the alert stuck on.
        #
        # Requires the failed-job set to live in Redis (QUEUE_FAILED_DRIVER on
        # the redis driver, key laravel_database_queues:default:failed) so the
        # redis exporter's check-keys can see it. If failed jobs are stored in
        # the MySQL failed_jobs table instead, this expr must be re-pointed at a
        # database exporter - see README.md "Failed jobs" note.
        - alert: TicketingFailedJobsIncreasing
          expr: |
            increase(
              redis_key_size{key="laravel_database_queues:default:failed"}[15m]
            ) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Failed jobs increasing over the last 15m"
            description: >-
              The failed-job set grew by {{ $value | printf "%.0f" }} in the
              last 15 minutes. Jobs are failing faster than they are being
              cleared. Inspect `php artisan queue:failed`.
            runbook_url: "https://github.com/brendonang/ticketing-platform/blob/main/docs/runbook.md#failed-jobs-increasing"
