# ==============================================================================
# Alertmanager routing - applied to the kube-prometheus-stack release
# ==============================================================================
# Install by passing this file to the SAME `helm upgrade` as
# kube-prometheus-stack.values.yaml (-f kube-prometheus-stack.values.yaml
# -f alertmanager.values.yaml). It configures WHERE alerts go and HOW they are
# grouped so a single node failure does not fan out into 30 notifications.
#
# The Slack webhook URL is NEVER written here. It is read at runtime from a
# mounted Kubernetes secret file (api_url_file), so this file is safe to commit.
# ==============================================================================

alertmanager:
  # ------------------------------------------------------------------------
  # Mount the webhook secret. The named secret must exist in the Alertmanager
  # namespace (monitoring) BEFORE install; create it out-of-band, e.g.:
  #   kubectl -n monitoring create secret generic alertmanager-slack \
  #     --from-literal=webhook-url='https://hooks.slack.com/services/XXX/YYY/ZZZ'
  # or, preferred, materialise it via an ExternalSecret from Secrets Manager.
  # The stack mounts listed secrets at /etc/alertmanager/secrets/<name>/.
  # ------------------------------------------------------------------------
  alertmanagerSpec:
    secrets:
      - alertmanager-slack

  config:
    global:
      resolve_timeout: 5m

    # ----------------------------------------------------------------------
    # Routing tree
    # ----------------------------------------------------------------------
    route:
      # Group alerts so related firings collapse into one message. A node going
      # away trips many per-pod alerts at once; grouping by these labels means
      # one grouped notification, not one per pod.
      group_by: ["alertname", "namespace", "cluster"]
      # Wait 30s to let a burst coalesce before the first notification.
      group_wait: 30s
      # Then at most one update per group per 5m.
      group_interval: 5m
      # Re-notify an unresolved alert every 4h - often enough to matter, rare
      # enough not to be ignored.
      repeat_interval: 4h
      receiver: slack-default
      routes:
        # Critical alerts get their own sub-route so they can page harder
        # (shorter repeat) without changing the warning cadence.
        - matchers:
            - severity = "critical"
          receiver: slack-critical
          repeat_interval: 1h
          continue: false

    # ----------------------------------------------------------------------
    # Inhibition: suppress lower-severity noise when a bigger problem is active
    # ----------------------------------------------------------------------
    inhibit_rules:
      # If a critical alert is firing for a namespace, mute warnings for the
      # same namespace/alertname - do not double-notify.
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ["namespace", "alertname"]
      # If a whole node/instance is down (KubeNodeNotReady from the stack's
      # default rules), mute the per-pod CrashLoop/backlog alerts it caused -
      # the root cause is the node, not each pod.
      - source_matchers:
          - alertname = "KubeNodeNotReady"
        target_matchers:
          - severity =~ "warning|critical"
        equal: ["cluster"]

    # ----------------------------------------------------------------------
    # Receivers. Both read the webhook from the mounted secret FILE, never a
    # literal. Swap slack_configs for a Telegram webhook the same way (its bot
    # token would live in the same mounted secret).
    # ----------------------------------------------------------------------
    receivers:
      - name: slack-default
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: "#ticketing-alerts"
            send_resolved: true
            title: '{{ template "slack.title" . }}'
            text: '{{ template "slack.text" . }}'

      - name: slack-critical
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: "#ticketing-alerts-critical"
            send_resolved: true
            title: '{{ template "slack.title" . }}'
            text: '{{ template "slack.text" . }}'

  # ------------------------------------------------------------------------
  # Message templates: put the runbook_url front and centre so whoever gets
  # paged has the fix one click away.
  # ------------------------------------------------------------------------
  templateFiles:
    ticketing.tmpl: |-
      {{ define "slack.title" -}}
      [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
      {{- end }}
      {{ define "slack.text" -}}
      {{ range .Alerts -}}
      *Severity:* {{ .Labels.severity }}
      *Summary:* {{ .Annotations.summary }}
      *Description:* {{ .Annotations.description }}
      {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
      {{ end -}}
      {{- end }}
